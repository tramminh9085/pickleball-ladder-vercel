<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người chơi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-light">
        <nav class="navbar-nav w-100 px-3">
            <a class="navbar-brand text-decoration-none" href="/">
                <i class="fas fa-circle"></i>Pickleball League
            </a>
            <div class="ms-auto">
                <a class="btn btn-sm btn-outline-primary me-2" href="/">
                    <i class="fas fa-arrow-left"></i> Về màn hình chính
                </a>
                <button type="button" class="btn btn-sm btn-primary" id="authButton">
                    <i class="fas fa-right-to-bracket"></i> Đăng nhập Admin
                </button>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <section class="player-management-card">
                <div class="management-header">
                    <h2>Quản lý người chơi</h2>
                    <p>Thêm, cập nhật hoặc xoá người chơi.</p>
                </div>
                <form id="playerForm" class="player-form admin-only d-none">
                    <input id="playerName" class="filter-input" type="text" placeholder="Họ tên *" required>
                    <input id="playerEmail" class="filter-input" type="email" placeholder="Email">
                    <input id="playerLocation" class="filter-input" type="text" placeholder="Địa điểm">
                    <input id="playerSkillLevel" class="filter-input" type="number" min="0" max="5" step="0.1" placeholder="Trình độ">
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="savePlayerButton">
                            <i class="fas fa-plus"></i> Thêm người chơi
                        </button>
                        <button type="button" class="btn btn-light d-none" id="cancelPlayerEdit">Huỷ sửa</button>
                    </div>
                </form>
                <div id="playerManagementList" class="management-list">
                    <div class="loading">Đang tải người chơi...</div>
                </div>
                <div id="playerMessage" class="match-message" role="status"></div>
            </section>
        </div>
    </main>
    <script src="/js/auth.js"></script>
    <script src="/js/players.js"></script>
</body>
</html>
